[alembic]
script_location = backend/app/migrations
sqlalchemy.url = postgresql+asyncpg://city_user:city_pass@localhost:5432/ai_twin_city
# ↑ overridden at runtime by env.py from settings.database_url; this is a fallback/doc value only.

# Run every alembic command as `python -m alembic ...` (not bare `alembic ...`), from
# the repo root, with `-c backend/alembic.ini`. env.py does `from backend.app...`,
# which needs the repo root on sys.path — `python -m` adds the CWD there; the bare
# `alembic` console script does not, and fails with "ModuleNotFoundError: No module
# named 'backend'".

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
