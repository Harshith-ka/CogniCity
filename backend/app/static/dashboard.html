<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COGNICITY_OS v2.4 • Tactical Command Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg-base: #06070a;
      --bg-panel: #0b0d13;
      --bg-card: #0f121a;
      --bg-card-hover: #141824;
      --border-dim: #1c2230;
      --border-bright: #2d3748;
      --cyan-primary: #00e5ff;
      --cyan-glow: rgba(0, 229, 255, 0.45);
      --cyan-dim: rgba(0, 229, 255, 0.12);
      --orange-primary: #ff6600;
      --orange-glow: rgba(255, 102, 0, 0.5);
      --orange-dim: rgba(255, 102, 0, 0.15);
      --red-alert: #ff3366;
      --green-nominal: #00e676;
      --text-main: #edf2f7;
      --text-dim: #8b9bb4;
      --text-muted: #4a5568;
      --font-display: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-mono);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ─────────────────────────────────────────────────────────────
   TOP HEADER (COGNICITY_OS BAR)
───────────────────────────────────────────────────────────── */
    header {
      height: 56px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--orange-primary);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 14px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .brand-version {
      font-size: 0.72rem;
      color: var(--cyan-primary);
      font-weight: 700;
      margin-left: 4px;
    }

    .defcon-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      padding: 6px 14px;
      border: 1px solid var(--border-dim);
      border-radius: 4px;
    }

    .defcon-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 700;
    }

    .defcon-bars {
      display: flex;
      gap: 4px;
    }

    .defcon-bar {
      width: 14px;
      height: 10px;
      background: #222a38;
      border-radius: 1px;
    }

    .defcon-bar.active-cyan {
      background: var(--cyan-primary);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .defcon-bar.active-orange {
      background: var(--orange-primary);
      box-shadow: 0 0 8px var(--orange-glow);
    }

    .defcon-val {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--cyan-primary);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sys-status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--cyan-dim);
      border: 1px solid var(--cyan-primary);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--cyan-primary);
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--cyan-primary);
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
    }

    .user-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .user-tag b {
      color: var(--orange-primary);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      background: #1a2233;
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* ─────────────────────────────────────────────────────────────
   MAIN CONTAINER (SIDEBAR + CONTENT)
───────────────────────────────────────────────────────────── */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────────────────────────
   TACTICAL SIDEBAR
───────────────────────────────────────────────────────────── */
    aside {
      width: 260px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 14px;
      overflow-y: auto;
      user-select: none;
    }

    aside::-webkit-scrollbar {
      width: 4px;
    }

    aside::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }

    .telemetry-box {
      background: #090b10;
      border: 1px solid var(--cyan-primary);
      border-radius: 4px;
      padding: 10px 12px;
      position: relative;
    }

    .telemetry-box::before {
      content: "SYSTEM TELEMETRY";
      position: absolute;
      top: -7px;
      left: 8px;
      background: var(--bg-panel);
      padding: 0 6px;
      font-size: 0.62rem;
      color: var(--cyan-primary);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .telemetry-row .k {
      color: var(--text-dim);
    }

    .telemetry-row .v {
      color: var(--cyan-primary);
      font-weight: 700;
    }

    .telemetry-row .v.orange {
      color: var(--orange-primary);
    }

    .btn-city-view {
      background: var(--orange-primary);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 16px var(--orange-glow);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-city-view:hover {
      background: #ff771a;
      box-shadow: 0 0 24px var(--orange-glow);
      transform: translateY(-1px);
    }

    .menu-divider {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.62rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin: 4px 0;
    }

    .menu-divider::before,
    .menu-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-dim);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.12s;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: var(--bg-card);
      color: var(--text-main);
      border-color: var(--border-dim);
    }

    .nav-item.active {
      background: var(--cyan-primary);
      color: #000;
      font-weight: 800;
      box-shadow: 0 0 14px var(--cyan-glow);
    }

    .nav-item .icon {
      font-size: 14px;
      width: 18px;
      text-align: center;
    }

    .hazard-status-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border-dim);
    }

    .hazard-stripes {
      height: 6px;
      width: 100%;
      background: repeating-linear-gradient(45deg,
          var(--orange-primary),
          var(--orange-primary) 8px,
          #11141d 8px,
          #11141d 16px);
      border-radius: 2px;
    }

    .secure-link-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--cyan-primary);
      font-weight: 700;
    }

    /* ─────────────────────────────────────────────────────────────
   CONTENT AREA & CYBER-TACTICAL CARDS
───────────────────────────────────────────────────────────── */
    main {
      flex: 1;
      background: transparent;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    main::-webkit-scrollbar {
      width: 6px;
    }

    main::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 3px;
    }

    .sector-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid var(--border-dim);
      padding-bottom: 12px;
    }

    .sector-tag {
      font-size: 0.72rem;
      color: var(--cyan-primary);
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .sector-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .sector-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tactical-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    /* Corner-Bracket Tactical Card */
    .tac-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      padding: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tac-card::before,
    .tac-card::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--cyan-primary);
      pointer-events: none;
    }

    .tac-card::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--cyan-primary);
      border-left: 2px solid var(--cyan-primary);
    }

    .tac-card::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid var(--cyan-primary);
      border-right: 2px solid var(--cyan-primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--cyan-primary);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-uid {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .metric-huge {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .metric-huge .delta {
      font-size: 0.85rem;
      color: var(--cyan-primary);
      font-weight: 700;
      vertical-align: middle;
      margin-left: 8px;
    }

    .capacity-meter {
      display: flex;
      gap: 3px;
      margin: 6px 0;
    }

    .cap-seg {
      flex: 1;
      height: 10px;
      background: #182030;
      border-radius: 1px;
    }

    .cap-seg.active {
      background: var(--cyan-primary);
      box-shadow: 0 0 6px var(--cyan-glow);
    }

    .stat-subtext {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 700;
    }

    /* Tactical Map Canvas */
    .map-canvas-container {
      height: 240px;
      background: #080a0f;
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    #tactical-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Tactical Data Table */
    .tac-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
    }

    .tac-table th {
      text-align: left;
      padding: 8px 10px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-dim);
      font-size: 0.65rem;
      letter-spacing: 1px;
    }

    .tac-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #141a24;
      color: var(--text-dim);
    }

    .tac-table tr:hover td {
      background: var(--bg-card-hover);
      color: #fff;
    }

    .badge-nominal {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 800;
    }

    .badge-monitored {
      background: rgba(255, 102, 0, 0.15);
      color: #ff6600;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 800;
    }

    .badge-delayed {
      background: rgba(255, 51, 102, 0.15);
      color: #ff3366;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 800;
    }

    /* Interactive Toggle Switch */
    .tac-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #0d1017;
      border: 1px solid var(--border-dim);
      border-radius: 4px;
    }

    .switch-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .switch-sub {
      font-size: 0.65rem;
      color: var(--cyan-primary);
    }

    .switch-btn {
      background: #1c2433;
      color: #64748b;
      border: none;
      padding: 4px 10px;
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
    }

    .switch-btn.on {
      background: var(--orange-primary);
      color: #000;
      box-shadow: 0 0 10px var(--orange-glow);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.3);
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>

  <!-- ─────────────────────────────────────────────────────────────
     HEADER
───────────────────────────────────────────────────────────── -->
  <header>
    <div class="brand-section">
      <div class="brand-icon">🛡️</div>
      <div class="brand-title">COGNICITY_OS<span class="brand-version">v2.4</span></div>
    </div>

    <div class="defcon-strip">
      <span class="defcon-label">DEFCON:</span>
      <div class="defcon-bars">
        <div class="defcon-bar active-cyan"></div>
        <div class="defcon-bar active-cyan"></div>
        <div class="defcon-bar active-cyan"></div>
        <div class="defcon-bar active-cyan"></div>
        <div class="defcon-bar active-orange"></div>

      </div>

    <div class="header-right">

      </div>

  </header>

  <!-- ─────────────────────────────────────────────────────────────
     MAIN INTERFACE
───────────────────────────────────────────────────────────── -->
  <div class="main-layout">

    <!-- ─────────────────────────────────────────────────────────
       SIDEBAR
  ───────────────────────────────────────────────────────── -->
    <aside>
      <div class="telemetry-box">
        <div class="telemetry-row"><span class="k">TICK</span><span class="v" id="tel-tick">000482</span></div>
        <div class="telemetry-row"><span class="k">POP</span><span class="v" id="tel-pop">10,000</span></div>
        <div class="telemetry-row"><span class="k">WX</span><span class="v orange" id="tel-wx">CLR_28C</span></div>
      </div>

      <a class="btn-city-view" href="/city3d" target="_blank">
        <span>⚙</span> CITY_VIEW
      </a>

      <div class="menu-divider">COMMAND_MODULES</div>

      <div class="nav-list" id="nav-list">
        <!-- Generated via Javascript for all 28 tabs -->
      </div>

      <div class="hazard-status-bar">
        <div class="hazard-stripes"></div>
        <div class="secure-link-text">
          <span>■ SECURE_LINK_ACTIVE</span>
          <span>99.9%</span>
        </div>
      </div>
    </aside>

    <!-- ─────────────────────────────────────────────────────────
       VIEWPORT
  ───────────────────────────────────────────────────────── -->
    <main id="main-viewport">
      <!-- Active tab rendered here dynamically -->
    </main>
  </div>

  <script>
    const API = window.location.origin;

    const MODULES = [
      { id: 'overview', name: 'OVERVIEW', icon: '⊞', sector: 'SECTOR: ALPHA-PRIME', title: 'GLOBAL OVERVIEW' },
      { id: 'live', name: 'LIVE ACTIVITY', icon: '📈', sector: 'SECTOR: TELEMETRY_FEED', title: 'LIVE CITIZEN ACTIVITY' },
      { id: 'citizens', name: 'CITIZENS', icon: '👥', sector: 'SEC: OMEGA', title: 'CITIZEN_DB_V4.2' },
      { id: 'economy', name: 'ECONOMY', icon: '🏛', sector: 'FIN_MATRIX // CENTRAL', title: 'MACROECONOMIC GRID' },
      { id: 'traffic', name: 'TRAFFIC', icon: '🚗', sector: 'TRANSIT // URBAN_GRID', title: 'TRAFFIC CONGESTION RADAR' },
      { id: 'comms', name: 'COMMS', icon: '💬', sector: 'SIGINT // INTERCEPT', title: 'CITIZEN COMMS NETWORK' },
      { id: 'government', name: 'GOVERNMENT', icon: '⚖', sector: 'GOVT_COMMAND', title: 'MUNICIPAL POLICY & RESOURCE ALLOCATION' },
      { id: 'social', name: 'SOCIAL', icon: '🤝', sector: 'GRAPH_ANALYSIS // NODES', title: 'SOCIAL INFLUENCE MATRIX' },
      { id: 'tactical_map', name: 'TACTICAL MAP', icon: '🗺️', sector: 'TACTICAL_GEO // SECTOR_A', title: 'GEOSPATIAL SCHEMATIC VIEW' },
      { id: 'events', name: 'EVENTS', icon: '⚡', sector: 'INCIDENT_FEED', title: 'CITY INCIDENT LOGS' },
      { id: 'disasters', name: 'DISASTERS', icon: '🌋', sector: 'DEFCON_ALERT // CRISIS', title: 'DISASTER SENSORS & EVACUATION' },
      { id: 'pandemic', name: 'PANDEMIC', icon: '☣', sector: 'MODULE // PUBLIC HEALTH', title: 'PANDEMIC MONITOR' },
      { id: 'elections', name: 'ELECTIONS', icon: '🗳', sector: 'POLITICAL_INTEL', title: 'VOTER POLLING & SENTIMENT' },
      { id: 'media', name: 'MEDIA', icon: '📱', sector: 'SURVEILLANCE_MEDIA', title: 'MEDIA DISPATCH & HASHTAGS' },
      { id: 'advisor', name: 'AI ADVISOR', icon: '🤖', sector: 'NEURAL_ORACLE // POLICY', title: 'AI TACTICAL POLICY ADVISOR' },
      { id: 'graph', name: 'GRAPH', icon: '🔗', sector: 'ENTITY_RELATIONSHIPS', title: 'KNOWLEDGE GRAPH ANALYSIS' },
      { id: 'weather', name: 'WEATHER', icon: '🌤', sector: 'METEOROLOGY_RADAR', title: 'ATMOSPHERIC SENSORS' },
      { id: 'crime', name: 'CRIME', icon: '🚔', sector: 'THREAT_MATRIX // SEC_OPS', title: 'CRIME & PATROL DEPLOYMENT' },
      { id: 'health', name: 'HEALTH', icon: '🏥', sector: 'MED_TELEMETRY', title: 'PUBLIC HEALTHCARE MATRIX' },
      { id: 'education', name: 'EDUCATION', icon: '🎓', sector: 'HUMAN_CAPITAL // EDU', title: 'EDUCATION & SKILL PROGRESSION' },
      { id: 'housing', name: 'HOUSING', icon: '🏠', sector: 'ZONING // VALUATION', title: 'HOUSING & REAL ESTATE MATRIX' },
      { id: 'news', name: 'NEWS', icon: '📰', sector: 'DAILY_WIRE // INTELLIGENCE', title: 'AUTONOMOUS CITY DISPATCH' },
      { id: 'culture', name: 'CULTURE', icon: '🎭', sector: 'CIVIC_MORALE // ARTS', title: 'CULTURE & CITIZEN VITALITY' },
      { id: 'environment', name: 'ENVIRONMENT', icon: '🌳', sector: 'ECOLOGY // AQI_SENSORS', title: 'ENVIRONMENTAL TELEMETRY' },
      { id: 'demographics', name: 'DEMOGRAPHICS', icon: '🧑', sector: 'CENSUS // AGE_PYRAMID', title: 'POPULATION PYRAMIDS' },
      { id: 'infrastructure', name: 'INFRASTRUCTURE', icon: '⚡', sector: 'CIVIC_WORKS // UTILITY', title: 'UTILITY GRIDS & CONSTRUCTION' },
      { id: 'tourism', name: 'TOURI SM', icon: '✈️', sector: 'VISITOR_INFLUX // ECO', title: 'TOURIST ATTRACTIONS & SPEND' },
      { id: 'sandbox', name: 'AI SANDBOX', icon: '🧪', sector: 'UNIVERSAL_HARNESS // PRE_DEPLOY', title: 'AI AGENT EVALUATION SANDBOX' },
    ];

    let activeTab = 'overview';
    let cachedCitizens = [];
    let cachedMetrics = {};

    // ─────────────────────────────────────────────────────────────
    // INITIALIZE NAVIGATION
    // ─────────────────────────────────────────────────────────────
    const navList = document.getElementById('nav-list');
    MODULES.forEach(m => {
      const item = document.createElement('div');
      item.className = `nav-item ${m.id === activeTab ? 'active' : ''}`;
      item.id = `nav-${m.id}`;
      item.innerHTML = `<span class="icon">${m.icon}</span><span>${m.name}</span>`;
      item.addEventListener('click', () => switchTab(m.id));
      navList.appendChild(item);
    });

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`nav-${tabId}`)?.classList.add('active');
      renderActiveView();
    }

      <!-- Results Right (7 cols) -->

          </div>
          <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; text-align:center;">
            <div style="background:#0a0d14; padding:10px; border-radius:2px;">
              <div style="font-size:0.65rem; color:var(--text-dim);">ADOPTION</div>
              <div class="metric-huge" style="color:var(--cyan-primary); font-size:1.4rem;">84.6%</div>
            </div>
            <div style="background:#0a0d14; padding:10px; border-radius:2px;">
              <div style="font-size:0.65rem; color:var(--text-dim);">TRUST</div>
              <div class="metric-huge" style="color:var(--cyan-primary); font-size:1.4rem;">0.81</div>
            </div>
            <div style="background:#0a0d14; padding:10px; border-radius:2px;">
              <div style="font-size:0.65rem; color:var(--text-dim);">ROBUSTNESS</div>
              <div class="metric-huge" style="color:var(--orange-primary); font-size:1.4rem;">92.4%</div>
            </div>
            <div style="background:#0a0d14; padding:10px; border-radius:2px;">
              <div style="font-size:0.65rem; color:var(--text-dim);">FAIRNESS</div>
              <div class="metric-huge" style="color:var(--cyan-primary); font-size:1.4rem;">0.89</div>
            </div>
          </div>
          <div style="font-size:0.75rem; color:var(--text-dim); background:#0a0d14; padding:10px; border-radius:2px; margin-top:8px;">

        </div>
      </div>
    </div>
  `;
    }

    // ─────────────────────────────────────────────────────────────
    // GENERIC MODULE TEMPLATE (FOR REMAINING TABS)
    // ─────────────────────────────────────────────────────────────
    function renderGenericModuleHTML(mod) {
      return `
    <div class="tactical-grid">
      <div class="tac-card" style="grid-column: span 8;">
        <div class="card-header">
          <span class="card-title">${mod.icon} ${mod.name}_TELEMETRY_STREAM</span>
          <span style="font-size:0.65rem; color:var(--cyan-primary);">STATUS: ACTIVE</span>
        </div>
        <div style="height:220px; display:flex; align-items:center; justify-content:center; background:#080a0f; border:1px solid var(--border-dim); border-radius:2px; color:var(--cyan-primary); font-size:0.85rem; font-weight:700;">
          [ LIVE ${mod.name} SENSOR DATA LINK ACTIVE • 60 FPS ]
        </div>
      </div>

      <div class="tac-card" style="grid-column: span 4;">
        <div class="card-header">
          <span class="card-title">STATUS_METRICS</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div class="stat-subtext"><span>EFFICIENCY</span><span style="color:var(--cyan-primary);">96.4%</span></div>
          <div class="stat-subtext"><span>ANOMALY_INDEX</span><span style="color:var(--green-nominal);">0.02 (LOW)</span></div>
          <div class="stat-subtext"><span>ACTIVE_AGENTS</span><span style="color:#fff;">1,420</span></div>
        </div>
      </div>
    </div>
  `;
    }

    // ─────────────────────────────────────────────────────────────
    // INTERACTIVE CHARTS & CANVASES
    // ─────────────────────────────────────────────────────────────
    function initTacticalCanvas() {
      const canvas = document.getElementById('tactical-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      ctx.fillStyle = '#080a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
      ctx.lineWidth = 1;
      const step = 28;
      for (let x = 0; x < canvas.width; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      // Draw Tactical Polygons
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.45)';
      ctx.beginPath();
      ctx.moveTo(60, 40); ctx.lineTo(160, 30); ctx.lineTo(190, 140); ctx.lineTo(90, 160); ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(220, 50); ctx.lineTo(340, 70); ctx.lineTo(320, 180); ctx.lineTo(210, 150); ctx.closePath();
      ctx.stroke();

      // Draw Incident Pin
      ctx.fillStyle = '#ff6600';
      ctx.fillRect(180, 80, 10, 10);
      ctx.strokeStyle = '#ff6600';
      ctx.strokeRect(175, 75, 20, 20);
      ctx.fillStyle = '#fff';
      ctx.font = '9px JetBrains Mono';
      ctx.fillText('INCIDENT_04', 205, 88);

      // Draw Active Node
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath(); ctx.arc(280, 120, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillText('NODE_ACTIVE', 295, 124);
    }

    function initRadarChart() {
      const ctx = document.getElementById('citizen-radar');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['INT', 'STR', 'END', 'AGI', 'PER'],
          datasets: [{
            label: 'STATS',
            data: [88, 55, 70, 82, 94],
            backgroundColor: 'rgba(0, 229, 255, 0.15)',
            borderColor: '#00e5ff',
            borderWidth: 2,
            pointBackgroundColor: '#00e5ff',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              grid: { color: '#1a2233' },
              angleLines: { color: '#1a2233' },
              pointLabels: { color: '#00e5ff', font: { family: 'JetBrains Mono', size: 10 } },
              ticks: { display: false }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function initSEIRChart() {
      const ctx = document.getElementById('seir-chart');
      if (!ctx) return;
      const days = Array.from({ length: 30 }, (_, i) => `D+${i * 3}`);
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: days,
          datasets: [
            { label: 'SUSCEPTIBLE', data: [98, 92, 80, 62, 44, 30, 20, 14, 10, 8], borderColor: '#00e5ff', borderDash: [4, 4], pointRadius: 0 },
            { label: 'EXPOSED', data: [2, 6, 15, 24, 28, 22, 14, 8, 4, 2], borderColor: '#a16207', pointRadius: 0 },
            { label: 'INFECTED', data: [0, 2, 8, 20, 36, 42, 32, 18, 9, 4], borderColor: '#ff6600', borderWidth: 2, pointRadius: 0 },
            { label: 'RECOVERED', data: [0, 0, 2, 8, 18, 34, 52, 68, 80, 88], borderColor: '#ffffff', pointRadius: 0 },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: '#141a24' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 } } },
            y: { grid: { color: '#141a24' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 9 } } }
          },
          plugins: { legend: { labels: { color: '#cbd5e1', font: { family: 'JetBrains Mono', size: 10 } } } }
        }
      });
    }

    function selectCitizen(id, name, role) {
      const nameEl = document.getElementById('insp-citizen-name');
      const roleEl = document.getElementById('insp-citizen-role');
      if (nameEl) nameEl.textContent = name;
      if (roleEl) roleEl.textContent = `OCCUPATION: ${role}`;
    }

    async function runAgentTest() {
      const btn = document.getElementById('btn-run-eval');
      btn.disabled = true;
      btn.textContent = 'RUNNING EVALUATION...';

      try {
        const payload = {
          agent_name: document.getElementById('sb-agent-name').value,
          domain_preset: document.getElementById('sb-schema').value,
          protocol: 'mock_benchmark',
          cohort_distribution: document.getElementById('sb-cohort').value,
          sample_size: parseInt(document.getElementById('sb-sample').value) || 500,
          simulation_horizon_days: parseInt(document.getElementById('sb-horizon').value) || 90,
        };
        const res = await fetch(API + '/api/eval/run-test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const data = await res.json();
          alert(`Evaluation complete! Adoption: ${data.overall_adoption_rate}%, Trust: ${data.avg_trust_index}`);
        }
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 RUN BEHAVIORAL EVALUATION & DRIFT';
      }
    }

    // ─────────────────────────────────────────────────────────────
    // DATA SYNC LOOP
    // ─────────────────────────────────────────────────────────────
    async function pollData() {
      try {
        const [status, metrics, citizens] = await Promise.all([
          fetch(API + '/api/simulation/status').then(r => r.json()).catch(() => null),
          fetch(API + '/api/analytics/metrics').then(r => r.json()).catch(() => null),
          fetch(API + '/api/citizens/?limit=100').then(r => r.json()).catch(() => null),
        ]);

        if (status) {
          document.getElementById('tel-tick').textContent = String(status.current_tick || 0).padStart(6, '0');
          document.getElementById('tel-pop').textContent = (status.population || 10000).toLocaleString();
        }
        if (metrics) cachedMetrics = metrics;
        if (citizens) cachedCitizens = citizens;
      } catch (e) { }
    }

    setInterval(pollData, 3000);
    pollData().then(() => renderActiveView());
  </script>
