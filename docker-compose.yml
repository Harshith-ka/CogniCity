services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: city_user
      POSTGRES_PASSWORD: city_pass
      POSTGRES_DB: ai_twin_city
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city_user -d ai_twin_city"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://city_user:city_pass@postgres:5432/ai_twin_city
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_pass
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # .env has OLLAMA_BASE_URL=localhost:11434 for native/host runs — inside this
      # container "localhost" is the container itself, not the host machine where
      # Ollama actually runs. host.docker.internal is Docker's way to reach the host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  dashboard:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    command: ["python", "-m", "streamlit", "run", "frontend/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
